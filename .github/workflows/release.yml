name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build artifacts and publish release
        uses: cargo-dist/actions/dist@v1
        with:
          # Runs both build and announce phases for tag pushes.
          command: "host"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
