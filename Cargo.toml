[package]
name = "mdget"
version = "0.3.0"
description = "Agent-first curl alternative"
edition = "2024"
rust-version = "1.90"
build = "build.rs"
authors = ["Hiran <hiranp@yahoo.com>"]
categories = ["command-line-utilities"]
keywords = ["cli", "command-line", "template"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/hiranp/mdget"
homepage = "https://github.com/hiranp/mdget"
documentation = "https://docs.rs/mdget"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
config = "0.15.19"
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = "4.5.66"
serde = { version = "1.0.228", features = ["derive"] }
directories = "6.0.0"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.22"
tracing-appender = "0.2.4"
tokio = { version = "1.49.0", features = ["full"] }
tokio-graceful-shutdown = "0.19.2"
miette = "7.6.0"

# Phase 1: HTTP Core & Basic Extraction dependencies
ureq       = "3.1"           # Pure Rust HTTP client (no system libcurl dependency)
scraper    = "0.20"          # HTML parsing (pulls html5ever transitively)
serde_yml  = "0.0.13"        # Replaces deprecated serde_yaml 0.9
chrono     = { version = "0.4", features = ["serde"] }
url        = "2.5"           # Absolute URL joining + percent-encoding
encoding_rs = "0.8"          # Charset detection

# Phase 2: Content Types & Output Modes dependencies
serde_json = "1.0"
mime = "0.3"
feed-rs = "2.3"
pdf-extract = "0.7"

[build-dependencies]
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = "4.5.66"
miette = "7.6.0"

# Release profile optimizations for binary size (M4 recommendation)
# These flags reduce binary size by ~30-40% without impacting runtime performance
[profile.release]
strip = true         # Remove debug symbols and symbol table (-3MB typically)
lto = true          # Link-time optimization - enables cross-crate inlining (-1-2MB)
codegen-units = 1   # Single codegen unit for better optimization (slower build, smaller binary)
opt-level = "z"     # Optimize for size over speed (alternative: "s" for size with some speed)

[[bin]]
name = "mdget"
path = "src/main.rs"

[dev-dependencies]
mockito = "1.7"
