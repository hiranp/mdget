[workspace]
allow-dirty = ["ci"]

[dist]
cargo-dist-version = "0.27.1"
ci = "github"
installers = ["shell", "powershell"]
tap = "{{gh-username}}/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
